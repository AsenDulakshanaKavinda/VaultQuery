[project]
name = "knowledge-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AsenDulakshnaKavinda", email = "s22010362@ousl.lk" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
knowledge-retrieval = "knowledge_retrieval:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
