[project]
name = "vtl-pipeline"
version = "0.1.0"
description = "Permission-aware data onboarding pipeline for Vanguard Transit & Logistics (VTL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # config + domain models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # storage
    "qdrant-client>=1.9",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    # connectors
    "slack-sdk>=3.27",
    "jira>=3.8",
    "msal>=1.28",          # Microsoft Graph auth for SharePoint
    "httpx>=0.27",
    # processing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    # api + messaging
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.8",
    "pika>=1.3",
    # reliability + logging
    "tenacity>=8.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3.7",
    "commitizen>=3.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtl_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests, no I/O",
    "contract: connectors against recorded API responses",
    "integration: needs docker compose services",
    "security: permission tests, must always pass before merge",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
