# Maps where a document lives (folder / channel / project) to the groups allowed to read it.
# Rules are evaluated top to bottom; FIRST match wins. Put specific rules above general ones.
# Anything that matches no rule is quarantined (see acl.quarantine_group), never made public.
#
# Group names must exist in group_hierarchy.yaml (validated at startup).

version: 1

rules:
  # ---------- SharePoint / S3 (Document & Binary Storage) ----------
  - id: sp-public-sops
    source_system: sharepoint
    match: { type: path_prefix, value: "/SharePoint/Public/SOPs/" }
    content_type: "Safety Manuals, General SOPs"
    confidentiality: public_internal
    allowed_groups: [grp_all]

  - id: sp-operations-hubs
    source_system: sharepoint
    match: { type: path_prefix, value: "/SharePoint/Operations/Hubs/" }
    content_type: "Warehouse Workflow Guides"
    confidentiality: operational
    allowed_groups: [grp_tier1_support, grp_account_managers]

  - id: sp-legal-contracts
    source_system: sharepoint
    match: { type: path_prefix, value: "/SharePoint/Legal/Contracts/" }
    content_type: "Client Master Agreements"
    confidentiality: confidential
    allowed_groups: [grp_account_managers, grp_directors]

  - id: s3-secure-vault-csuite
    source_system: s3
    match: { type: path_prefix, value: "/S3/secure-vault/c-suite/" }
    content_type: "Board Minutes, M&A Strategy"
    confidentiality: restricted
    allowed_groups: [grp_c_suite]

  # ---------- Slack (Collaboration & Communication) ----------
  - id: slack-public
    source_system: slack
    match: { type: channel_name, values: [announcements, general, safety-protocols] }
    confidentiality: public
    allowed_groups: [grp_all]

  - id: slack-operational
    source_system: slack
    match: { type: channel_name, values: [hub-rotterdam-ops, shipping-dispatches] }
    confidentiality: operational
    allowed_groups: [grp_tier1_support, grp_account_managers]

  - id: slack-client-private
    source_system: slack
    match: { type: channel_name, values: [account-apex-logistics, exec-strategy] }
    confidentiality: restricted_confidential
    allowed_groups: [grp_account_managers, grp_c_suite]
    # Add further client channels here explicitly. Unlisted channels are quarantined.

  # ---------- Jira (Issue Tracking & Support Logs) ----------
  - id: jira-it
    source_system: jira
    match: { type: project_key, values: [IT] }
    content_type: "Internal IT support tickets, hardware logs"
    confidentiality: internal_operational
    allowed_groups: [grp_all]

  - id: jira-wh
    source_system: jira
    match: { type: project_key, values: [WH] }
    content_type: "Hub disruptions, sorting errors, inventory counts"
    confidentiality: operational
    allowed_groups: [grp_tier1_support, grp_account_managers]

  - id: jira-sec
    source_system: jira
    match: { type: project_key, values: [SEC] }
    content_type: "Border delays, cargo flags, compliance incidents"
    confidentiality: confidential_restricted
    allowed_groups: [grp_account_managers, grp_c_suite]
