# Non-secret tunables. Secrets live in .env (see .env.example).
# Validated at startup by src/vtl_pipeline/settings.py

org_id: vtl                       # tenant id stamped on every chunk

chunking:
  chunk_size_tokens: 512
  chunk_overlap_tokens: 64
  chunker_version: "1"            # bump when chunking logic changes (triggers reindex)

embedding:
  provider: sentence-transformers # sentence-transformers | openai | voyage
  model: BAAI/bge-small-en-v1.5   # placeholder default, change freely
  dimensions: 384                 # must match the model
  batch_size: 64

vector_store:
  collection: vtl_knowledge
  distance: Cosine
  # payload fields that get an index, required for fast pre-retrieval filtering
  indexed_payload_fields: [allowed_groups, org_id, source_system, doc_id]

pipeline:
  batch_size: 100
  max_retries: 5
  retry_backoff_seconds: 2
  dead_letter_after_failures: 5
  skip_unchanged: true            # skip re-embedding when content_hash is unchanged
  tombstone_deletes: true         # remove vectors when the source object is removed

acl:
  mapping_file: config/acl_mapping.yaml
  hierarchy_file: config/group_hierarchy.yaml
  quarantine_group: grp_quarantine   # nobody holds this group, unmapped content is invisible
  fail_on_unmapped: false            # true = abort the run instead of quarantining

s3:
  bucket: vtl-enterprise-docs-prod
  prefixes: [secure-vault/, public/, operations/, legal/]
  allowed_extensions: [.pdf, .docx, .txt, .md]

sharepoint:
  enabled: false                  # turn on once Graph credentials exist
  site_ids: []

slack:
  enabled: true
  min_message_chars: 15           # noise filter: shorter messages are discarded
  collapse_threads: true          # parent + replies become one Conversation Block
  backfill_days: 365

jira:
  enabled: true
  projects: [IT, WH, SEC]
  backfill_jql: "project IN (WH, SEC, IT) AND status = Closed ORDER BY updated DESC"
  webhook_events: [jira:issue_created, jira:issue_updated, comment_created]

api:
  host: 0.0.0.0
  port: 8000
  top_k_default: 8
