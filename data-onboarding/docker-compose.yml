name: vtl-pipeline

services:
  postgres:
    image: postgres:17.10
    container_name: vtl_postgres
    environment:
      POSTGRES_DB: vtl_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtl_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Jira PostgreSQL database — disabled
  # postgres-jira:
  #   image: postgres:17.10
  #   container_name: vtl_postgres_jira
  #   environment:
  #     POSTGRES_DB: jiradb
  #     POSTGRES_USER: jirauser
  #     POSTGRES_PASSWORD: jirapassword
  #   volumes:
  #     - postgres_jira_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U jirauser -d jiradb"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 5s
  #   restart: unless-stopped

  # Jira Software — disabled
  # jira:
  #   image: atlassian/jira-software:10.4.0-ubi9
  #   container_name: vtl_jira
  #   depends_on:
  #     postgres-jira:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ATL_JDBC_URL: jdbc:postgresql://postgres-jira:5432/jiradb
  #     ATL_JDBC_USER: jirauser
  #     ATL_JDBC_PASSWORD: jirapassword
