  #     ATL_DB_TYPE: postgres72
  #   volumes:
  #     - jira_data:/var/atlassian/application-data/jira
  #   restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: vtl_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: vtl_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vtl_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vtl_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: vtl_minio_init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 3
        done
        mc mb --ignore-existing local/vtl-enterprise-docs-prod
        echo "Bucket vtl-enterprise-docs-prod is ready"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword

volumes:
  postgres_data:
  # postgres_jira_data:  # Jira only
  # jira_data:           # Jira only
  qdrant_data:
  minio_data: