[project]
name = "data-onboarding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AsenDulakshnaKavinda", email = "s22010362@ousl.lk" }
]
requires-python = ">=3.12"
dependencies = [
    "commitizen>=4.19.2",
    "minio>=7.2.20",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "structlog>=26.1.0",
]

[project.scripts]
data-onboarding = "data_onboarding:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
